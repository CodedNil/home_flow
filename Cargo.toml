[package]
name = "home_flow"
version = "0.2.0"
edition = "2024"

[dependencies]
log = "0.4.29"
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ron = "0.12.0"
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
uuid = { version = "1.19.0", features = ["v4", "fast-rng", "js", "serde"] }
parking_lot = "0.12.5"
ahash = { version = "0.8.12", features = ["serde"] }
indexmap = "2.12.1"
strum = "0.27.2"
strum_macros = "0.27.2"
bitflags = { version = "2.10.0", features = ["serde"] }
nestify = "0.3.3"
diff = "0.1.13"
glam = { version = "0.30.9", features = ["serde"] }
nalgebra = { version = "0.34.1", features = ["std"], default-features = false }
image = { version = "0.25.9", default-features = false, features = ["png"] }
geo = "0.32.0"
geo-types = { version = "0.7.18", features = ["serde"] }

# GUI dependencies
egui = { version = "0.33.2", features = ["serde"], optional = true }
eframe = { version = "0.33.2", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
], optional = true }
egui-notify = { version = "0.21.0", optional = true }
ehttp = { version = "0.6.0", optional = true }

# WebAssembly dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.56"
web-sys = "0.3.83"

# Server dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
simple_logger = "5.1.0"
axum = { version = "0.8.7", default-features = false, features = [
    "http1",
    "tokio",
] }
tokio = { version = "1.48.0", features = ["full"] }
tokio-tungstenite = "0.28.0"
futures-util = "0.3.31"
tower-http = { version = "0.6.7", features = [
    "fs",
    "compression-deflate",
    "compression-gzip",
] }
chrono = { version = "0.4.42", features = [
    "serde",
    "alloc",
    "now",
], default-features = false }
dotenvy = "0.15.7"
argon2 = "0.5.3"
rand = "0.9.2"

[features]
default = ["gui"]
gui = ["egui", "eframe", "egui-notify", "ehttp"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
too-many-lines = "allow"
suboptimal-flops = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
